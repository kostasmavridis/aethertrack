# AetherTrack – Minimal Stack (Slice 18)
# Brings up: Postgres 16, Redpanda (Kafka-compatible), HAPI FHIR R5, supplement-domain-service
# Remaining services (scheduling, fhir-service, intake, frontend) are defined but commented out;
# they will be uncommented in Slice 19.

name: aethertrack

networks:
  aethertrack:
    driver: bridge

volumes:
  postgres_data:
  redpanda_data:
  hapi_data:

services:

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aethertrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-aethertrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aethertrack_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-aethertrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aethertrack} -d ${POSTGRES_DB:-aethertrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────
  # Redpanda (Kafka-compatible, KRaft – no ZooKeeper)
  # ─────────────────────────────────────────────────────────────────
  kafka:
    image: redpandadata/redpanda:v24.3.1
    container_name: aethertrack-kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=kafka:33145
      - --advertise-rpc-addr=kafka:33145
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --default-log-level=warn
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "${KAFKA_PORT:-19092}:19092"
      - "${KAFKA_SCHEMA_PORT:-18081}:18081"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────
  # Redpanda Console (optional UI at http://localhost:8085)
  # ─────────────────────────────────────────────────────────────────
  kafka-console:
    image: redpandadata/console:v2.7.2
    container_name: aethertrack-kafka-console
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yaml
    volumes:
      - ./redpanda/console-config.yaml:/etc/redpanda/console-config.yaml:ro
    ports:
      - "${KAFKA_CONSOLE_PORT:-8085}:8080"
    networks:
      - aethertrack

  # ─────────────────────────────────────────────────────────────────
  # HAPI FHIR R5 v8
  # ─────────────────────────────────────────────────────────────────
  hapi-fhir:
    image: hapiproject/hapi:v8.0.0
    container_name: aethertrack-hapi-fhir
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      spring.datasource.url:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aethertrack}
      spring.datasource.username: ${POSTGRES_USER:-aethertrack}
      spring.datasource.password: ${POSTGRES_PASSWORD:-aethertrack_secret}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      hapi.fhir.fhir_version: R5
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.allow_multiple_delete: "true"
    volumes:
      - hapi_data:/data/hapi
    ports:
      - "${HAPI_PORT:-8080}:8080"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/fhir/metadata > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  # supplement-domain-service (Slice 18 – first containerised service)
  # ─────────────────────────────────────────────────────────────────
  supplement-domain-service:
    build:
      context: ../backend
      dockerfile: supplement-domain-service/Dockerfile
    image: aethertrack/supplement-domain-service:local
    container_name: aethertrack-domain
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT:         8081
      DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aethertrack}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-aethertrack}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aethertrack_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${DOMAIN_SERVICE_PORT:-8081}:8081"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

