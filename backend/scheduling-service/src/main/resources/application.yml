spring:
  application:
    name: scheduling-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.aethertrack: DEBUG
