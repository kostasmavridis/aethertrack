spring:
  application:
    name: scheduling-service

  datasource:
    url:      ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/aethertrack}
    username: ${DATASOURCE_USERNAME:aethertrack}
    password: ${DATASOURCE_PASSWORD:aethertrack_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
      idle-timeout: 300000

  flyway:
    enabled: true
    schemas: scheduling
    default-schema: scheduling
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: scheduling
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: scheduling-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer:   org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

timefold:
  solver:
    termination:
      spent-limit: 10s
    environment-mode: REPRODUCIBLE

aethertrack:
  topics:
    regimen-created: regimen.created
  outbox:
    poll-interval-ms: 2000

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aethertrack.scheduling: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    ai.timefold: INFO
