spring:
  application:
    name: supplement-domain-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aethertrack}
    username: ${DB_USER:aethertrack}
    password: ${DB_PASS:aethertrack}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DomainPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only validates
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true    # /actuator/health/liveness  /actuator/health/readiness

logging:
  level:
    root: INFO
    com.aethertrack: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    com.zaxxer.hikari: INFO
