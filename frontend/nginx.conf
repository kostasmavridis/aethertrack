# Nginx config for AetherTrack frontend container.
# Serves the Vite-built SPA and proxies /api/* to supplement-domain-service
# so the browser never hits the backend directly (no CORS headers needed).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback – all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* to supplement-domain-service inside the Docker network
    location /api/ {
        proxy_pass         http://supplement-domain-service:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Lightweight health endpoint for Docker healthcheck
    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
