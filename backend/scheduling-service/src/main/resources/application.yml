spring:
  application:
    name: scheduling-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: scheduling-service
      auto-offset-reset: earliest
      enable-auto-commit: false

timefold:
  solver:
    termination:
      spent-limit: 10s
    environment-mode: REPRODUCIBLE

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aethertrack.scheduling: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
    ai.timefold: INFO
