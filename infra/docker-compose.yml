# AetherTrack – Full Stack (Slice 19)
# Brings up: Postgres 18, Redpanda (Kafka-compatible), HAPI FHIR R5,
#            supplement-domain-service, scheduling-service, fhir-service,
#            intake-service, frontend (nginx)
#
# NOTE: PostgreSQL 18 changed PGDATA to /var/lib/postgresql/18/docker and the
# declared VOLUME to /var/lib/postgresql. The named volume MUST be mounted at
# /var/lib/postgresql (not /data) and PGDATA set explicitly, otherwise data
# is written to a silent anonymous volume and lost on container recreation.
# See: https://github.com/docker-library/postgres/issues/1370

name: aethertrack

networks:
  aethertrack:
    driver: bridge

volumes:
  postgres_data:
  redpanda_data:
  hapi_data:

services:

  # ─────────────────────────────────────────────────────────────────
  # PostgreSQL 18
  # Mount at /var/lib/postgresql (parent); PG18 stores data in 18/docker/ subdir.
  # ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: aethertrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-aethertrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aethertrack_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-aethertrack}
      PGDATA:            /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aethertrack} -d ${POSTGRES_DB:-aethertrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─────────────────────────────────────────────────────────────────
  # Redpanda (Kafka-compatible, KRaft – no ZooKeeper)
  # ─────────────────────────────────────────────────────────────────
  kafka:
    image: redpandadata/redpanda:v25.3.9
    container_name: aethertrack-kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=kafka:33145
      - --advertise-rpc-addr=kafka:33145
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --default-log-level=warn
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "${KAFKA_PORT:-19092}:19092"
      - "${KAFKA_SCHEMA_PORT:-18081}:18081"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────────────────────────
  # Redpanda Console (optional UI at http://localhost:8085)
  # ─────────────────────────────────────────────────────────────────
  kafka-console:
    image: redpandadata/console:v2.8.4
    container_name: aethertrack-kafka-console
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yaml
    volumes:
      - ./redpanda/console-config.yaml:/etc/redpanda/console-config.yaml:ro
    ports:
      - "${KAFKA_CONSOLE_PORT:-8085}:8080"
    networks:
      - aethertrack

  # ─────────────────────────────────────────────────────────────────
  # HAPI FHIR R5
  # ─────────────────────────────────────────────────────────────────
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: aethertrack-hapi-fhir
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      spring.datasource.url:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aethertrack}
      spring.datasource.username: ${POSTGRES_USER:-aethertrack}
      spring.datasource.password: ${POSTGRES_PASSWORD:-aethertrack_secret}
      spring.datasource.driverClassName: org.postgresql.Driver
      spring.jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.fhir_version: R5
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.allow_multiple_delete: "true"
    volumes:
      - hapi_data:/data/hapi
    ports:
      - "${HAPI_PORT:-8080}:8080"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/fhir/metadata > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  # supplement-domain-service
  # ─────────────────────────────────────────────────────────────────
  supplement-domain-service:
    build:
      context: ../backend
      dockerfile: supplement-domain-service/Dockerfile
    image: aethertrack/supplement-domain-service:local
    container_name: aethertrack-domain
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aethertrack}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aethertrack}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aethertrack_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${DOMAIN_SERVICE_PORT:-8081}:8081"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────
  # scheduling-service
  # Reads RegimenCreated from Kafka, runs Timefold solver, persists
  # scheduled_dose rows in the `scheduling` schema.
  # ─────────────────────────────────────────────────────────────────
  scheduling-service:
    build:
      context: ../backend
      dockerfile: scheduling-service/Dockerfile
    image: aethertrack/scheduling-service:local
    container_name: aethertrack-scheduling
    restart: unless-stopped
    depends_on:
      supplement-domain-service:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aethertrack}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-aethertrack}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aethertrack_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${SCHEDULING_PORT:-8082}:8082"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  # fhir-service
  # Consumes RegimenCreated + OptimizationCompleted; writes FHIR resources to HAPI.
  # ─────────────────────────────────────────────────────────────────
  fhir-service:
    build:
      context: ../backend
      dockerfile: fhir-service/Dockerfile
    image: aethertrack/fhir-service:local
    container_name: aethertrack-fhir
    restart: unless-stopped
    depends_on:
      hapi-fhir:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aethertrack}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-aethertrack}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aethertrack_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FHIR_BASE_URL: http://hapi-fhir:8080/fhir
    ports:
      - "${FHIR_SERVICE_PORT:-8083}:8083"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────
  # intake-service
  # Records supplement intake logs; publishes IntakeLogged events for adherence evaluation.
  # ─────────────────────────────────────────────────────────────────
  intake-service:
    build:
      context: ../backend
      dockerfile: intake-service/Dockerfile
    image: aethertrack/intake-service:local
    container_name: aethertrack-intake
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      SPRING_PROFILES_ACTIVE: docker
      DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aethertrack}
      DATASOURCE_USERNAME: ${POSTGRES_USER:-aethertrack}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aethertrack_secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${INTAKE_PORT:-8084}:8084"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ─────────────────────────────────────────────────────────────────
  # frontend (React/Vite → nginx)
  # nginx.conf proxies /api/* to supplement-domain-service inside the Docker network.
  # ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: aethertrack/frontend:local
    container_name: aethertrack-frontend
    restart: unless-stopped
    depends_on:
      supplement-domain-service:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - aethertrack
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
