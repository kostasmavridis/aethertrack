spring:
  application:
    name: supplement-domain-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aethertrack}
    username: ${SPRING_DATASOURCE_USERNAME:aethertrack}
    password: ${SPRING_DATASOURCE_PASSWORD:aethertrack}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DomainPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

outbox:
  poll:
    interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aethertrack: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.apache.kafka: WARN
