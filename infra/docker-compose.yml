version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: aethertrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       aethertrack
      POSTGRES_USER:     aethertrack
      POSTGRES_PASSWORD: aethertrack_secret
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethertrack -d aethertrack"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: redpandadata/redpanda:v24.3.4
    container_name: aethertrack-kafka
    restart: unless-stopped
    command:
      - redpanda start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka:9092
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  hapi-fhir:
    image: hapiproject/hapi:v8.8.0-distroless
    container_name: aethertrack-fhir
    restart: unless-stopped
    environment:
      hapi.fhir.fhir_version: R5
      spring.datasource.url: jdbc:postgresql://postgres:5432/aethertrack
      spring.datasource.username: aethertrack
      spring.datasource.password: aethertrack_secret
      spring.datasource.driverClassName: org.postgresql.Driver
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/fhir/metadata > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
