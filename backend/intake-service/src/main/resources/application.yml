spring:
  application:
    name: intake-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
server:
  port: 8084
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.aethertrack: DEBUG
